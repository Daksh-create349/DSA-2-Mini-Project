<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">Three range minimum query approaches</title>
  <desc id="description">Linear scan examines each item, sparse table combines precomputed overlapping blocks, and segment tree stores interval minimums hierarchically.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="#f1f5f9"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#172033">
    <rect x="20" y="20" width="370" height="380" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="45" y="60" font-size="24" font-weight="700">1. Linear scan</text>
    <text x="45" y="89" font-size="15" fill="#475569">Inspect the selected values in order.</text>
    <g font-size="18" text-anchor="middle" font-weight="700">
      <rect x="48" y="150" width="54" height="54" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="75" y="184">8</text>
      <rect x="105" y="150" width="54" height="54" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="132" y="184">5</text>
      <rect x="162" y="150" width="54" height="54" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="189" y="184">9</text>
      <rect x="219" y="150" width="54" height="54" rx="6" fill="#dbeafe" stroke="#2563eb"/><text x="246" y="184">3</text>
      <rect x="276" y="150" width="54" height="54" rx="6" fill="#e2e8f0" stroke="#94a3b8"/><text x="303" y="184">7</text>
    </g>
    <path d="M130 226 H270" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
    <text x="200" y="257" text-anchor="middle" font-size="15">Compare each item in [1, 3]</text>
    <rect x="82" y="300" width="246" height="55" rx="8" fill="#eff6ff"/>
    <text x="205" y="334" text-anchor="middle" font-size="19" font-weight="700" fill="#1d4ed8">Minimum: 3</text>

    <rect x="415" y="20" width="370" height="380" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="440" y="60" font-size="24" font-weight="700">2. Sparse table</text>
    <text x="440" y="89" font-size="15" fill="#475569">Precompute blocks; combine two per query.</text>
    <g font-size="15" text-anchor="middle" font-weight="700">
      <rect x="455" y="140" width="62" height="50" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="486" y="171">min</text>
      <rect x="521" y="140" width="62" height="50" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="552" y="171">min</text>
      <rect x="587" y="140" width="62" height="50" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="618" y="171">min</text>
      <rect x="653" y="140" width="62" height="50" rx="5" fill="#ffedd5" stroke="#ea580c"/><text x="684" y="171">min</text>
    </g>
    <rect x="455" y="207" width="128" height="50" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="519" y="238" text-anchor="middle" font-size="15" font-weight="700">block minimum</text>
    <rect x="587" y="207" width="128" height="50" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="651" y="238" text-anchor="middle" font-size="15" font-weight="700">block minimum</text>
    <text x="585" y="286" text-anchor="middle" font-size="15">Prepared table makes queries O(1).</text>
    <text x="585" y="322" text-anchor="middle" font-size="15" fill="#9a3412">Point update rebuilds this table.</text>

    <rect x="810" y="20" width="370" height="380" rx="14" fill="#fff" stroke="#cbd5e1"/>
    <text x="835" y="60" font-size="24" font-weight="700">3. Segment tree</text>
    <text x="835" y="89" font-size="15" fill="#475569">Store minimums for nested intervals.</text>
    <g fill="#dcfce7" stroke="#15803d" stroke-width="2">
      <circle cx="995" cy="142" r="25"/>
      <circle cx="930" cy="218" r="23"/><circle cx="1060" cy="218" r="23"/>
      <circle cx="890" cy="296" r="20"/><circle cx="970" cy="296" r="20"/>
      <circle cx="1020" cy="296" r="20"/><circle cx="1100" cy="296" r="20"/>
    </g>
    <g stroke="#15803d" stroke-width="2" fill="none">
      <path d="M980 163 L944 198 M1010 163 L1046 198"/>
      <path d="M916 239 L898 277 M944 239 L962 277"/>
      <path d="M1046 239 L1028 277 M1074 239 L1092 277"/>
    </g>
    <g fill="#166534" font-family="Arial" font-size="14" font-weight="700" text-anchor="middle">
      <text x="995" y="147">min</text><text x="930" y="223">min</text><text x="1060" y="223">min</text>
      <text x="890" y="301">value</text><text x="970" y="301">value</text>
      <text x="1020" y="301">value</text><text x="1100" y="301">value</text>
    </g>
    <text x="995" y="350" text-anchor="middle" font-size="15">Update one path; query O(log n).</text>
  </g>
</svg>
